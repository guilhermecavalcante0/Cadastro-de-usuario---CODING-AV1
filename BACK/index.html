<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>
</head>

<body>

    <h1>Cadastro de Usuário</h1>

    <form>

        <label for="nome">Nome Completo:</label><br>
        <input type="text" id="nome" name="nome">
        
<br><br>

        <label for="senha">Senha:</label><br>
        <input type="password" id="senha" name="senha">

<br><br>

        <label for="idade">Idade:</label><br>
        <input type="number" id="idade" name="idade">

<br><br>

        <label for="nascimento">Data de Nascimento:</label><br>
        <input type="date" id="nascimento" name="nascimento">

<br><br>

            <label>Gênero:</label><br>

        <input type="radio" id="masculino" name="genero" value="masculino">
        <label for="masculino">Masculino</label><br>

        <input type="radio" id="feminino" name="genero" value="feminino">
        <label for="feminino">Feminino</label><br>

        <input type="radio" id="outro" name="genero" value="outro">
        <label for="outro">Outro</label>

<br><br>

            <label>Interesses:</label><br>

        <input type="checkbox" id="html" name="interesses" value="html">
        <label for="html">HTML</label><br>

        <input type="checkbox" id="css" name="interesses" value="css">
        <label for="css">CSS</label><br>

        <input type="checkbox" id="javascript" name="interesses" value="javascript">
        <label for="javascript">JavaScript</label>

<br><br>

            <label for="cidade">Cidade:</label><br>

        <select id="cidade" name="cidade">

                <option value="" selected>-- Escolha uma cidade --</option>

            <option value="sao-paulo">Fortaleza</option>
            <option value="rio-de-janeiro">Itaitinga</option>
            <option value="belo-horizonte">Belo Horizonte</option>
            <option value="salvador">Salvador</option>
            <option value="curitiba">Curitiba</option>

        </select>

<br><br>

            <label for="mensagem">Mensagem:</label><br>

        <textarea id="mensagem" name="mensagem" rows="4" cols="35"></textarea>

<br><br>

            <label for="foto">Foto de Perfil:</label><br>
        <input type="file" id="foto" name="foto">

<br><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">

    </form>

</body>
</html>
